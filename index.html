<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
        <meta name="theme-color" content="#faf8f5">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="140文字">
        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <title>140文字チェッカー</title>
        <style>
        :root{
            font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
            color:#272727;background:#faf8f5
            }*{box-sizing:border-box}
            body{margin:0;padding:28px 18px 60px}
            .wrap{max-width:650px;margin:0 auto}
            h1{font-size:1.6rem;margin:26px 0 8px}
            p{color:#6c6863;line-height:1.7}
            .panel{background:white;border:1px solid #e5dfd7;border-radius:18px;padding:18px;box-shadow:0 6px 22px #27272708}
            textarea{display:block;width:100%;min-height:230px;border:0;resize:vertical;outline:none;font:inherit;line-height:1.75;font-size:17px;color:#242424}
            textarea::placeholder{color:#aaa}.bottom{border-top:1px solid #eae5de;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:12px}
            .count{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
            .count.over{color:#c43f3f}
            .status{font-size:.84rem;color:#777}
            .status.over{color:#c43f3f}
            .buttons{display:flex;gap:10px;margin-top:16px}
            button{border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer}
            #copy{background:#252525;color:white;flex:1}
            #reset{background:#ebe6de;color:#444}
            .hint{font-size:12px;margin-top:18px}
            #message{min-height:1.4em;font-size:13px;color:#48714d}
            @media(max-width:380px){
                h1{font-size:1.35rem}
                .panel{padding:14px}
                }
            </style>
    </head>
    <body>
        <main class="wrap">
            <h1>✍️ 140文字チェッカー</h1>
            <p>【今日やったこと】を140文字以内に。入力するだけで文字数を確認できます。</p>
            <div class="panel">
                <textarea id="post" aria-label="投稿文" placeholder="【今日やったこと】&#10;" spellcheck="true">
                </textarea>
                <div class="bottom">
                    <div>
                        <div id="count" class="count">
                            0 / 140文字
                        </div>
                        <div id="status" class="status">
                            残り140文字
                        </div>
                    </div>
                    <span aria-hidden="true">
                        📝
                    </span>
                </div>
            </div>
            <div class="buttons">
                <button id="copy">
                    文章をコピー
                </button>
                <button id="reset">
                    クリア
                </button>
            </div>
            <div id="message" role="status" aria-live="polite">
            </div>
            <p class="hint">
                文章はこの端末のブラウザ内に自動保存されます。X独自のURL・絵文字等のカウント方式とは異なる場合があります。
            </p>
        </main>
        <script>
        const post=document.getElementById('post'),
        count=document.getElementById('count'),
        status=document.getElementById('status'),
        message=document.getElementById('message');
        const key='x140_draft_v1';
        try{post.value=localStorage.getItem(key)||''}catch(e){}function update(){let n=Array.from(post.value).length;count.textContent=n+' / 140文字';
        status.textContent=n>140?`${n-140}文字オーバー`:`残り${140-n}文字`;
        count.classList.toggle('over',n>140);
        status.classList.toggle('over',n>140);
        try{localStorage.setItem(key,post.value)}catch(e){}}post.addEventListener('input',()=>{update();message.textContent=''});
        document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(post.value);message.textContent='コピーしました！'}catch(e){post.focus();
        post.select();message.textContent='選択しました。コピー操作をしてください。'}});document.getElementById('reset').addEventListener('click',()=>{if(post.value&&!confirm('入力中の文章を消しますか？'))return;post.value='';update();message.textContent='クリアしました';post.focus()});update();
        </script>
    </body>
</html>
